<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Deployment pyramid">
  <rect width="400" height="280" fill="#0f172a"/>
  <text x="200" y="28" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Deployment pyramid</text>
  <polygon points="200,50 320,230 80,230" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="75" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="system-ui">Source (git)</text>
  <text x="200" y="115" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="system-ui">CI build + test</text>
  <text x="200" y="155" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="system-ui">Artifact (image)</text>
  <text x="200" y="195" fill="#fde68a" font-size="11" text-anchor="middle" font-family="system-ui">Deploy ’ runtime ’ CDN ’ user</text>
  <text x="200" y="255" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">Same artifact promoted through stages  never rebuild per environment</text>
</svg>
