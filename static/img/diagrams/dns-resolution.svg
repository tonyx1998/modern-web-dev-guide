<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="DNS resolution flow">
  <rect width="720" height="220" fill="#0f172a"/>
  <text x="360" y="26" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">DNS resolution (simplified)</text>
  <rect x="30" y="50" width="100" height="44" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="80" y="77" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui">Browser</text>
  <rect x="170" y="50" width="100" height="44" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="220" y="77" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui">Resolver</text>
  <rect x="310" y="50" width="100" height="44" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="360" y="77" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui">Root TLD</text>
  <rect x="450" y="50" width="110" height="44" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="505" y="77" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="system-ui">Authoritative</text>
  <rect x="590" y="50" width="100" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="640" y="72" fill="#93c5fd" font-size="11" text-anchor="middle" font-family="system-ui">93.184.216.34</text>
  <text x="640" y="86" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">IP address</text>
  <text x="360" y="130" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="system-ui">example.com ’ recursive lookups ’ A record</text>
  <text x="360" y="155" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui">Cached at each hop so repeat visits are fast</text>
</svg>
