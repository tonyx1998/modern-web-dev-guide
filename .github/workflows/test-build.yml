name: Test build (PRs)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run validate-prereqs
      - run: npm run typecheck
      - run: npm run build
